name: Validate static review site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check the complete website
        run: npm test
      - name: Retain static review build
        uses: actions/upload-artifact@v4
        with:
          name: napco-static-review-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
