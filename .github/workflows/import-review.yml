name: Import prepared NAPCO review website

on:
  push:
    branches: [main]
    paths:
      - '.napco-import/**'
      - '.github/workflows/import-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napco-initial-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'aneesmohamed1805/napco' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and import the prepared package
        run: python3 .napco-import/import.py
      - name: Build and validate all review pages
        run: npm test
      - name: Save review build artifact
        uses: actions/upload-artifact@v4
        with:
          name: napco-static-review-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Commit verified source and local media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .napco-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore .nvmrc README.md package.json content docs public scripts src
          git add -u -- .napco-import
          git diff --cached --stat
          git commit -m 'Import verified NAPCO static review site: 21 pages and original assets'
          git push origin HEAD:main
          echo 'Verified website source committed. No website or DNS deployment performed.'
